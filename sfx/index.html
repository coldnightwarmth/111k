<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <title>111k sounds</title>
  <meta name="description" content="every 111k sound effect, every version: listen and pick">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="sfx.css">
  <script type="importmap">{"imports": {"three": "../vendor/three/three.module.min.js"}}</script>
</head>
<body>
  <header id="top">
    <div class="row1">
      <a class="home" href="../">111k</a>
      <h1>sounds</h1>
      <label class="ctl"><input type="checkbox" id="echo" checked> tunnel echo</label>
      <label class="ctl">volume <input type="range" id="vol" min="0" max="1.5" step="0.05" value="1"></label>
      <span id="status"></span>
      <button type="button" id="reset" class="quiet">back to the game's</button>
      <button type="button" id="copy" class="primary">copy picks</button>
    </div>
    <p class="help">
      Click a version to hear it (each click is a new take). <b>use</b> picks it: the game uses it in this browser straight away
      (reload the game's tab), and <b>copy picks</b> copies your choices to send over. <b>game's</b> marks what everyone hears now.
    </p>
  </header>
  <main id="list"></main>
  <script type="module" src="../src/sfx-page.js"></script>
</body>
</html>
