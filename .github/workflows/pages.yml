name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['server/**', 'tools/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html styles.css favicon.svg src vendor assets anim graffiti _site/
          # every deploy's code gets its own version in its import paths, so browsers fetch the new code
          # straight away instead of running what they cached from the last deploy for up to ten minutes
          V="${GITHUB_SHA::10}"
          find _site/src -name '*.js' -o -name '*.mjs' | xargs sed -i -E "s#((from|import)[[:space:]]*\(?[[:space:]]*'\.\.?/[^']+\.m?js)'#\1?v=$V'#g"
          sed -i -E "s#src=\"src/main\.js\"#src=\"src/main.js?v=$V\"#; s#href=\"styles\.css\"#href=\"styles.css?v=$V\"#" _site/index.html
          # the level's files go by a hash of their contents (src/level.js), so they're only fetched again
          # when the level actually changes; the preload asks for that exact file, not a second copy
          L="$(cat assets/env/world.glb assets/env/world*.json assets/env/world-*.webp | sha256sum | cut -c1-10)"
          sed -i -E "s#^const LEVEL_VERSION = '';#const LEVEL_VERSION = '$L';#" _site/src/level.js
          grep -q "LEVEL_VERSION = '$L'" _site/src/level.js
          sed -i -E "s#href=\"assets/env/world\.glb\"#href=\"assets/env/world.glb?v=$L\"#" _site/index.html
          grep -q "world.glb?v=$L" _site/index.html
          grep -q "main.js?v=$V" _site/index.html
          # the emote previewer (/anim): the same for its script and stylesheet
          sed -i -E "s#src=\"\.\./src/anim\.js\"#src=\"../src/anim.js?v=$V\"#; s#href=\"anim\.css\"#href=\"anim.css?v=$V\"#" _site/anim/index.html
          grep -q "anim.js?v=$V" _site/anim/index.html
          # the graffiti review (/graffiti): the same
          sed -i -E "s#src=\"\.\./src/graffiti-page\.js\"#src=\"../src/graffiti-page.js?v=$V\"#; s#href=\"graffiti\.css\"#href=\"graffiti.css?v=$V\"#" _site/graffiti/index.html
          grep -q "graffiti-page.js?v=$V" _site/graffiti/index.html
          touch _site/.nojekyll
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
