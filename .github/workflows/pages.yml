name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['server/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build the site (tools/build_site.sh: the game bundled into one file, versioned paths), then look round the
  # very files that will be deployed in a headless browser (tools/smoke.mjs: it has to load, connect, draw,
  # walk, pick something up and put it down with no errors). Anything failing stops the deploy.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save esbuild@0.24.0 puppeteer-core@23.11.1
      - name: Room logic tests
        run: node --test server/test/*.test.mjs
      - name: Build the site
        run: bash tools/build_site.sh "${GITHUB_SHA::10}"
      - name: Smoke test the build in headless Chrome
        run: SITE_ROOT=_site node tools/smoke.mjs "$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000      # GitHub's side is sometimes slow to take the files (its default gives up after 10 minutes)
