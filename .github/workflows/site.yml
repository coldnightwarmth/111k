name: Deploy site to Cloudflare

# The same build as GitHub Pages (tools/build_site.sh), smoke-tested the same way, served from Cloudflare
# (wrangler.site.jsonc). Uses the same repository secrets as the multiplayer server.
on:
  push:
    branches: [main]
    paths-ignore: ['server/**', '**.md']
  workflow_dispatch:

concurrency:
  group: site-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save esbuild@0.24.0 puppeteer-core@23.11.1
      - name: Build the site
        run: bash tools/build_site.sh "${GITHUB_SHA::10}"
      - name: Smoke test the build in headless Chrome
        run: SITE_ROOT=_site node tools/smoke.mjs "$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx --yes wrangler@4 deploy --config wrangler.site.jsonc
