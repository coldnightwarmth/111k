<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <title>111k</title>
  <meta name="description" content="an abandoned room off the loop. hang out.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">{"imports": {"three": "./vendor/three/three.module.min.js"}}</script>
  <link rel="modulepreload" href="vendor/three/three.module.min.js">
  <link rel="preload" href="assets/env/office.glb" as="fetch" crossorigin>
  <link rel="preload" href="assets/avatars/drifella-default.glb" as="fetch" crossorigin>
</head>
<body>
  <canvas id="view" aria-label="3D hangout space"></canvas>
  <div id="bubbles" aria-hidden="true"></div>

  <header id="top">
    <strong>111k</strong>
    <span id="status" data-state="connecting" title="connecting"></span>
    <span id="online">…</span>
  </header>

  <p id="hint">click to look around · <kbd>WASD</kbd> move · <kbd>shift</kbd> run · <kbd>space</kbd> jump · <kbd>C</kbd> crouch · <kbd>enter</kbd> chat · <kbd>E</kbd> emotes · <kbd>V</kbd> view</p>

  <section id="chat">
    <div class="log" role="log" aria-live="polite" aria-label="chat"></div>
    <form hidden><input type="text" placeholder="say something…" autocomplete="off" enterkeyhint="send" aria-label="message"></form>
  </section>

  <nav id="emotes" hidden aria-label="emotes"></nav>

  <div id="touch">
    <div id="stick" aria-label="move"><i></i></div>
    <div id="buttons">
      <button id="btnView" type="button" aria-label="switch view">view</button>
      <button id="btnEmote" type="button" aria-label="emotes">emote</button>
      <button id="btnChat" type="button" aria-label="chat">chat</button>
      <button id="btnCrouch" type="button" aria-label="crouch">duck</button>
      <button id="btnJump" type="button" aria-label="jump">jump</button>
    </div>
  </div>

  <div id="loading"><p>going down…</p></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
