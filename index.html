<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <title>111k</title>
  <meta name="description" content="an abandoned room off the loop. hang out.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">{"imports": {"three": "./vendor/three/three.module.min.js"}}</script>
  <link rel="modulepreload" href="vendor/three/three.module.min.js">
  <link rel="preload" href="assets/env/world.glb" as="fetch" crossorigin>
  <link rel="preload" href="assets/paintings/previews.webp" as="image">
</head>
<body>
  <canvas id="view" aria-label="3D hangout space"></canvas>
  <div id="bubbles" aria-hidden="true"></div>

  <header id="top">
    <strong>111k</strong>
    <span id="status" data-state="connecting" title="connecting"></span>
    <span id="online">…</span>
    <button id="micBtn" type="button" data-state="off" aria-label="voice settings" aria-expanded="false" aria-controls="voiceDock" title="voice settings"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/><path class="slash" d="M4 4l16 16"/></svg></button>
  </header>
  <aside id="voiceDock" aria-label="voice settings"></aside>

  <p id="hint"><span data-cmd="look">click to look around</span> · <span data-cmd="move"><kbd>WASD</kbd> move</span> · <span data-cmd="run"><kbd>shift</kbd> run</span> · <span data-cmd="jump"><kbd>space</kbd> jump</span> · <span data-cmd="crouch"><kbd>C</kbd> crouch</span> · <span data-cmd="chat"><kbd>enter</kbd> chat</span> · <span data-cmd="emotes"><kbd>E</kbd> emotes</span> · <span data-cmd="view"><kbd>V</kbd> view</span> · <span data-cmd="use"><kbd>click</kbd> punch / use</span> · <span data-cmd="drop"><kbd>right click</kbd> drop</span></p>
  <p id="prompt" aria-live="polite"></p>
  <p id="speedo" aria-hidden="true"><b>0</b><span>mph</span></p>
  <p id="artno" aria-hidden="true"><span>no.</span><b></b></p>
  <p id="koth" aria-live="polite"><svg viewBox="0 0 24 16" aria-hidden="true"><path d="M2 14 1 3l6 5 5-7 5 7 6-5-1 11z"/></svg><span></span><b></b><small></small></p>
  <p id="emoteLabel" hidden></p>
  <p id="tagLabel" hidden></p>
  <p id="paintLabel" hidden></p>

  <section id="chat">
    <div class="log" role="log" aria-live="polite" aria-label="chat"></div>
    <form hidden><input type="text" placeholder="say something…" autocomplete="off" enterkeyhint="send" aria-label="message"></form>
  </section>

  <nav id="emotes" hidden aria-label="emotes"></nav>
  <aside id="gallery" hidden aria-label="pieces to spray"><h2>tags</h2><div class="list"></div><div class="paints"></div></aside>

  <div id="touch">
    <div id="stick" aria-label="move"><i></i></div>
    <div id="buttons">
      <button id="btnView" type="button" aria-label="switch view">view</button>
      <button id="btnEmote" type="button" aria-label="emotes">emote</button>
      <button id="btnChat" type="button" aria-label="chat">chat</button>
      <button id="btnCrouch" type="button" aria-label="crouch">crouch</button>
      <button id="btnJump" type="button" aria-label="jump">jump</button>
      <button id="btnAct" type="button" aria-label="use">punch</button>
      <button id="btnDrop" type="button" aria-label="drop">drop</button>
      <button id="btnGallery" type="button" aria-label="choose a piece">tags</button>
    </div>
  </div>

  <div id="picker" hidden></div>
  <div id="loading"><p><span>going down…</span></p></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
